<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a1124" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes nodeBlink {
        0%, 100% { r: 5; opacity: 0.8; }
        50% { r: 7.5; opacity: 1; }
      }
      .flowing-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 20s linear infinite;
      }
      .flowing-line-fast {
        stroke-dasharray: 6 4;
        animation: dashFlow 12s linear infinite reverse;
      }
      .glowing-orb {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .floating-group {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .node-pulse {
        animation: nodeBlink 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Glowing Orbs (Dynamic Background) -->
  <circle class="glowing-orb" cx="180" cy="110" r="180" fill="url(#glow-cyan)" />
  <circle class="glowing-orb" cx="1020" cy="270" r="220" fill="url(#glow-purple)" style="animation-delay: -3s;" />

  <!-- Dynamic SRM Network Flow Graph (Background Layer) -->
  <g opacity="0.45">
    <!-- Connecting Supply Chain Synapses -->
    <path d="M 80,180 Q 240,60 400,140 T 720,130 T 1000,80 T 1140,160" fill="none" stroke="#06b6d4" stroke-width="1.8" class="flowing-line" />
    <path d="M 120,290 Q 320,340 540,240 T 880,260 T 1120,230" fill="none" stroke="#8b5cf6" stroke-width="1.8" class="flowing-line-fast" />
    <path d="M 280,110 L 400,240 L 600,160 L 800,250 L 960,140" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 4" />

    <!-- Constellation Data Nodes -->
    <circle cx="80" cy="180" r="5" fill="#06b6d4" class="node-pulse" />
    <circle cx="400" cy="140" r="6" fill="#3b82f6" class="node-pulse" style="animation-delay: -1s;" />
    <circle cx="720" cy="130" r="5" fill="#8b5cf6" class="node-pulse" style="animation-delay: -2s;" />
    <circle cx="1000" cy="80" r="6" fill="#06b6d4" class="node-pulse" style="animation-delay: -1.5s;" />
    <circle cx="1140" cy="160" r="5" fill="#10b981" class="node-pulse" style="animation-delay: -0.5s;" />
    <circle cx="400" cy="240" r="4.5" fill="#8b5cf6" />
    <circle cx="880" cy="260" r="5" fill="#3b82f6" class="node-pulse" style="animation-delay: -2.5s;" />
  </g>

  <!-- Foreground Content: Unobstructed & High Contrast -->
  <g filter="url(#drop-shadow)">
    <!-- Top Pill / Badge -->
    <g transform="translate(60, 42)">
      <rect width="360" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="14" r="5" fill="#10b981" />
      <text x="30" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Awesome Supplier Relationship Management
    </text>
    <text x="60" y="165" fill="url(#accent-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">
      (SRM) &amp; Procurement Architecture
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="60" y="206" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Enterprise SaaS Platforms • Open-Source Systems • Supplier Onboarding • AI Sourcing &amp; Governance
    </text>
  </g>

  <!-- Interactive/Dynamic Domain Feature Cards (Foreground Row) -->
  <g class="floating-group" transform="translate(60, 246)">
    <!-- Card 1: Enterprise S2P -->
    <g transform="translate(0, 0)">
      <rect width="250" height="84" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="84" rx="2" fill="#3b82f6" />
      <text x="18" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🏢 Enterprise S2P / SRM</text>
      <text x="18" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">SAP Ariba, Coupa, Workday</text>
      <text x="18" y="68" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Spend &amp; Contract Governance →</text>
    </g>

    <!-- Card 2: Risk & Onboarding -->
    <g transform="translate(270, 0)">
      <rect width="250" height="84" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="84" rx="2" fill="#06b6d4" />
      <text x="18" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🛡️ Vetting &amp; Compliance</text>
      <text x="18" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Graphite, Apex, Tealbook</text>
      <text x="18" y="68" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Sanctions, Tax &amp; SOC 2 Vetting →</text>
    </g>

    <!-- Card 3: Performance & Scorecards -->
    <g transform="translate(540, 0)">
      <rect width="250" height="84" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="84" rx="2" fill="#8b5cf6" />
      <text x="18" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">📊 Scorecards &amp; Audits</text>
      <text x="18" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">OTD, PPM, SCAR Workflows</text>
      <text x="18" y="68" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Supplier KPI Benchmarking →</text>
    </g>

    <!-- Card 4: Agentic Open-Source -->
    <g transform="translate(810, 0)">
      <rect width="250" height="84" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="84" rx="2" fill="#10b981" />
      <text x="18" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🤖 Agentic Open-Source</text>
      <text x="18" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">mcp-supplier, BidMaster, Forge</text>
      <text x="18" y="68" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">MCP Tools &amp; Autonomous RFQ →</text>
    </g>
  </g>
</svg>
